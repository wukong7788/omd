[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ohmydata"
version = "0.1.7"
description = "Financial and alternative market data ingestion SDK."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "OMD contributors" }]
dependencies = []

[project.scripts]
omd = "ohmydata.cli:main"

[project.optional-dependencies]
tushare = ["pandas>=2.0,<3.0", "tushare>=1.4,<2.0"]
polars = [
  "pandas>=2.0,<3.0",
  "polars>=1.38.1,<2.0",
  "pyarrow>=23.0.1,<24.0",
]
vintage-plane = ["pandas>=2.0,<3.0", "pyarrow>=23.0.1,<24.0"]
sec-cli = ["pyarrow>=23.0.1,<24.0"]
sec-financials = [
  "edgartools>=5.0.0",
  "pyarrow>=23.0.1,<24.0",
]

[dependency-groups]
dev = [
  "pandas>=2.0",
  "pandas-stubs>=2.2",
  "polars>=1.38.1,<2.0",
  "pyarrow>=23.0.1,<24.0",
  "pytest>=8.3",
  "ruff>=0.8",
  "ty>=0.0.78",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ohmydata"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ohmydata",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
  "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
missing-argument = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
redundant-cast = "ignore"
